<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゆゆチャ</title>
  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.0/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
        margin: 0;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; 
      background-color: #ddd; 
    }

    .custom-card {
      width: 18rem;
      border: 1px solid #ccc; 
      background-color: #eee; 
      border-radius: 10px; 
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
      padding: 20px; 
    }

    .card-title {
      color: #333; 
      margin-bottom: 15px; 
    }
    .card-text {
      color: #666; 
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card custom-card text-center">
      <div class="card-body">
        <h2 class="card-title">ゆゆチャはお休み中です</h2>
        <p class="card-text">エラーが頻発する状況になり、古くなってメンテナンスも難しくなってきたので、一旦サーバーの課金を止めるためにお休みしています。</p>
        <p class="card-text">今は <a href="http://ushikado.github.io/">他のおもちゃ</a> で遊びながら、<a href="https://twitter.com/ushik_ado">@ushik_ado</a> の今後の活動を温かい目で見守ってください。</p>
      </div>
    </div>
  </div>
  <!-- Bootstrap JavaScript (お使いのサイトで必要に応じて) -->
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
